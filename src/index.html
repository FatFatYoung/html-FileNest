}
.source-item:hover { background: var(--bg-3); color: var(--text); }

  /* 目录树 */
  .tree-node {

    display: flex; align-items: center; gap: 4px;
    color: var(--text-2); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

  .tree-node:hover { background: var(--bg-3); color: var(--text); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.toolbar {
  padding: 8px 12px; background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.icon-btn {
  width: 32px; height: 32px; flex-shrink: 0;
  border: 1px solid transparent; background: transparent;
  color: var(--text-2); border-radius: 6px; cursor: pointer;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
}
.icon-btn:hover:not(:disabled) { background: var(--bg-3); color: var(--text); }
.icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.breadcrumb {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px;
  overflow: hidden; white-space: nowrap; font-size: 13px;
}
.breadcrumb span {
  cursor: pointer; color: var(--accent-2);
  padding: 4px 6px; border-radius: 4px;
}
.breadcrumb span:hover { background: var(--bg-3); }
.breadcrumb .sep { color: var(--border); cursor: default; padding: 0; }
.breadcrumb .sep:hover { background: transparent; }
.search {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text);
  padding: 6px 10px; font-size: 13px; width: 150px; outline: none;
}
.search:focus { border-color: var(--accent); }
.btn {
  padding: 6px 12px; border: 1px solid var(--border);
  background: var(--bg-3); color: var(--text);
  border-radius: 6px; cursor: pointer; font-size: 13px;
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
}
.btn:hover { background: #2d333b; }
.btn.primary { background: var(--accent); border-color: var(--accent); }
.btn.primary:hover { background: #388bfd; }
.btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: rgba(248,81,73,0.15); }
.file-list { flex: 1; overflow-y: auto; padding: 12px; }
.file-list.grid-view {
  display: grid;
  /* 网格最小宽度从 110px 增大到 150px，减少缩放时文件名被截断的概率 */
  grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
  gap: 8px; align-content: start;
}
.file-list.list-view { display: flex; flex-direction: column; gap: 1px; }
.file-item {
  border-radius: 6px; cursor: pointer;
  padding: 12px 8px; text-align: center;
  position: relative;
  user-select: none;
}
.file-item:hover { background: var(--bg-2); }
.file-item.selected { background: rgba(31,111,235,0.2); outline: 1px solid var(--accent); }
.file-item .icon { font-size: 32px; margin-bottom: 6px; line-height: 1; }
.file-item .name {
  font-size: 12px; word-break: break-word; overflow-wrap: break-word; line-height: 1.3;
}
.list-view .file-item {
  /* 名称列用 minmax(0,1fr)，配合省略号保证名称列不挤压其他列 */
  display: grid; grid-template-columns: 24px minmax(0,1fr) auto auto;
  align-items: center; gap: 12px;
  padding: 8px 12px; text-align: left;
}
.list-view .file-item .icon { font-size: 18px; margin: 0; }
/* 名称过长时省略显示，hover 时由 title 提示完整名称 */
.list-view .file-item .name {
  -webkit-line-clamp: unset; word-break: normal;
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.list-view .file-item .size,
.list-view .file-item .time { color: var(--text-2); font-size: 12px; text-align: right; }
/* 用 em 单位随字体缩放自适应，不再用固定 px */
.list-view .file-item .size { min-width: 6em; }
.list-view .file-item .time { min-width: 10em; }
.empty {
  grid-column: 1/-1; text-align: center;
  padding: 60px 20px; color: var(--text-2);
}
.empty .emoji { font-size: 48px; display: block; margin-bottom: 12px; opacity: 0.5; }
/* 分组视图的分组标题 */
.group-title {
  grid-column: 1/-1;
  padding: 10px 6px 4px;
  font-size: 12px; font-weight: 600;
  color: var(--text-2); letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
  position: sticky; top: 0; background: var(--bg); z-index: 1;
}
.list-view .group-title { padding: 12px 12px 4px; }
/* 工具栏排序/分组控件 */
.toolbar select.search { width: 112px; cursor: pointer; }
.btn.toggled { background: rgba(31,111,235,0.2); border-color: var(--accent); color: var(--accent-2); }
.statusbar {
  padding: 6px 16px; border-top: 1px solid var(--border);
  color: var(--text-2); font-size: 12px;
  display: flex; gap: 16px; align-items: center;
  background: var(--bg-2);
}
.preview {
  width: 0; overflow: hidden; flex-shrink: 0;
  background: var(--bg-2); border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width 0.2s ease;
}
.preview.open { width: var(--preview-w, 440px); min-width: 240px; max-width: 75vw; position: relative; }
.preview.no-transition { transition: none !important; }
/* 拖拽手柄：左边缘竖条 */
.preview-resizer {
  position: absolute; left: -3px; top: 0; bottom: 0; width: 6px;
  cursor: col-resize; z-index: 10;
}
.preview-resizer:hover, .preview-resizer.dragging { background: var(--accent); opacity: 0.4; }
.preview-header {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.preview-header .title {
  flex: 1; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; font-weight: 500; font-size: 13px;
}
.preview-body { flex: 1; overflow: auto; padding: 12px; }
.preview-body img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.preview-body video, .preview-body audio { max-width: 100%; width: 100%; }
.preview-body iframe {
  width: 100%; height: calc(100vh - 180px);
  border: 0; border-radius: 4px; background: white;
}
.preview-body pre {
  white-space: pre-wrap; word-break: break-all;
  font-family: "Cascadia Code","Consolas",monospace;

}
.office-html { font-size: 13px; line-height: 1.6; }
.office-html img { max-width: 100%; height: auto; }
.office-html table { border-collapse: collapse; width: 100%; margin: 8px 0; }
.office-html td, .office-html th { border: 1px solid var(--border); padding: 4px 8px; }
.preview-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: none; align-items: center; justify-content: center;
  z-index: 1000; backdrop-filter: blur(2px);
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 20px;
  min-width: 360px; max-width: 90vw;
  box-shadow: 0 16px 48px rgba(0,0,0,0.5);
}
.modal-title { font-weight: 600; margin-bottom: 12px; font-size: 14px; }
.modal-input {
  width: 100%; padding: 8px 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text);
  font-size: 14px; outline: none; margin-bottom: 16px;
}
.modal-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.context-menu {
  position: fixed; background: var(--bg-2);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 4px; min-width: 180px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 999; display: none;
}
.context-menu.show { display: block; }
.context-menu .item {
  padding: 8px 12px; cursor: pointer; border-radius: 4px;
  font-size: 13px; display: flex; align-items: center; gap: 8px;
}
.context-menu .item:hover { background: var(--bg-3); }
.context-menu .item.danger { color: var(--danger); }
.context-menu .sep { height: 1px; background: var(--border); margin: 4px 0; }
.app.dragover::after {
  content: var(--drag-tip, '松开鼠标上传文件');

  font-size: 24px; font-weight: 600; color: var(--accent-2);
  pointer-events: none; z-index: 500;

/* —— 侧栏收起/展开（工具栏 ◧ 按钮 / Ctrl+B）—— */
.sidebar { transition: width .18s ease; }
.app.sidebar-collapsed .sidebar { width: 0; border-right: none; }

          segments.push({ label: segs[i], path: a });

  function sortItems(arr) {

    return e ? '.' + e : '无后缀';
  }
  var CATEGORY_HEAD = ['文件夹', '图片', '压缩包'];   // 固定在前的类别；其余按后缀名分组
  var groupCollapsed = {};   // 分组展开/收起状态

  // —— 桌面入口（所有位置页）：桌面文件夹入口与盘符并列 ——
  function desktopEntry() {
    return { name: tr('桌面'), path: state.desktop.path, type: 'dir', size: 0, mtime: 0, ext: '', _desktop: true, _entry: true };
  }
  function loadDesktop(force) {
    var d = state.desktop;
    if (d.loading) return;
    if (d.ready && !force) return;
    d.loading = true;
    apiGet('/api/desktop').then(function (r) {
      d.loading = false; d.ready = true;
      d.path = r.path || '';
      // 桌面路径就绪后把入口补进盘符列表（与 C/D 盘并列）
      if (state.current && state.current.path === '*' && d.path &&
          !state.items.some(function (i) { return i._desktop; })) {
        state.items.push(desktopEntry());
        render();
      }
    }).catch(function () {
      d.loading = false; d.ready = true; d.path = '';
    });
  }

  // —— 我的收藏 ——
  function isFav(p) {
    return state.favorites.some(function (f) { return f.path === p; });
  }
  function favItems() {
    return state.favorites.map(function (f) {
      var ext = (f.name.match(/\.([^.]+)$/) || [])[1] || '';
      return { name: f.name, path: f.path, type: f.type === 'dir' ? 'dir' : 'file', size: 0, mtime: f.addedAt || 0, ext: ext.toLowerCase(), _fav: true };
    });
  }
  function loadFavorites() {
    return apiGet('/api/favorites').then(function (r) {
      state.favorites = r.favorites || [];
      if (state.current && (state.current.path === '*' || state.current.path === '*fav*' || state.current.path === '*recycle*' || state.current.path === '*search*')) render();
    }).catch(function () {});
  }
  function toggleFavorite(item) {
    var done = function (r) {
      state.favorites = r.favorites || [];
      updatePreviewFavBtn();
      render();
    };
    if (isFav(item.path)) {
      apiPost('/api/unfavorite', { path: item.path }).then(done)
        .catch(function (e) { showToast(tr('操作失败: ') + e.message, 'error'); });
    } else {
      apiPost('/api/favorites', { path: item.path, type: item.type }).then(done)
        .catch(function (e) { showToast(tr('操作失败: ') + e.message, 'error'); });
    }
  }
  function showFavorites() {
    loadFavorites();
    state.current = { path: '*fav*', source: 'default' };
    state.items = favItems();
    state.selected = null; state.multi = []; state.anchor = null;
    render();
  }

  function renderList() {
    listEl.innerHTML = '';
    listEl.className = 'file-list ' + (state.viewMode === 'grid' ? 'grid-view' : 'list-view');
    var items = sortItems(filteredItems());
    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<span class="emoji">📂</span>' +
        (state.filter ? tr('没有匹配的文件') : tr('此文件夹为空'));
      listEl.appendChild(empty);
      return;
    }
    if (state.group) {
      // 分组显示：入口卡片不参与分组（平铺置顶）；文件夹/图片/压缩包固定在前，
      // 其余细化到按后缀名分组（数量多的在前）
      var entryItems = [], groupedItems = [];
      items.forEach(function (x) { (x._entry ? entryItems : groupedItems).push(x); });
      entryItems.forEach(function (item) { listEl.appendChild(makeItemEl(item)); });
      var buckets = {};
      groupedItems.forEach(function (x) {
        var c = itemCategory(x);
        (buckets[c] = buckets[c] || []).push(x);
      });
      Object.keys(buckets).sort(function (a, b) {
        var ia = CATEGORY_HEAD.indexOf(a), ib = CATEGORY_HEAD.indexOf(b);
        if (ia >= 0 || ib >= 0) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
        if (buckets[b].length !== buckets[a].length) return buckets[b].length - buckets[a].length;
        return a.localeCompare(b, 'zh');
      }).forEach(function (cat) {
        var h = document.createElement('div');
        h.className = 'group-title';
        h.style.cursor = 'pointer';
        h.title = tr('点击展开 / 收起');
        h.textContent = (groupCollapsed[cat] ? '▸ ' : '▾ ') + grpName(cat) + tr('（{n}）', { n: buckets[cat].length });
        h.onclick = function () {
          groupCollapsed[cat] = !groupCollapsed[cat];
          renderList();
        };
        listEl.appendChild(h);
        if (!groupCollapsed[cat]) buckets[cat].forEach(function (item) { listEl.appendChild(makeItemEl(item)); });
      });
    } else {
      items.forEach(function (item) { listEl.appendChild(makeItemEl(item)); });
    }
    // —— 我的收藏模块（所有位置页，正常盘符下另起一行的新模块） ——
    if (state.current && state.current.path === '*') {
      var favs = favItems();
      var fh = document.createElement('div');
      fh.className = 'group-title';
      fh.style.cssText = 'grid-column:1/-1;width:100%;margin-top:12px;';
      fh.textContent = tr('我的收藏（{n}）', { n: favs.length });
      listEl.appendChild(fh);
      if (favs.length) {
        favs.forEach(function (item) { listEl.appendChild(makeItemEl(item)); });
      } else {
        var tip = document.createElement('div');
        tip.className = 'empty';
        tip.style.cssText = 'grid-column:1/-1;width:100%;';
        tip.textContent = tr('右键文件/文件夹 → 收藏到首页');
        listEl.appendChild(tip);
      }
    }
  }
  // —— 多选模型（Ctrl 点选 / Shift 区间 / 鼠标框选） ——
  function isSel(it) {
    return state.multi.some(function (x) { return x.path === it.path; });
  }
  function selectOnly(item) {
    state.multi = item ? [item] : [];
    state.anchor = item || null;
  }
  function toggleSel(item) {
    var i = -1;
    state.multi.forEach(function (x, k) { if (x.path === item.path) i = k; });
    if (i >= 0) state.multi.splice(i, 1); else state.multi.push(item);
    state.anchor = item;
  }
  function selectRange(item) {
    var a = -1, b = -1;
    state.items.forEach(function (x, k) {
      if (state.anchor && x.path === state.anchor.path) a = k;
      if (x.path === item.path) b = k;
    });
    if (a < 0 || b < 0) return selectOnly(item);
    state.multi = state.items.slice(Math.min(a, b), Math.max(a, b) + 1);
  }
  function selectedItems() {
    if (state.multi.length) return state.multi.slice();
    return state.selected ? [state.selected] : [];
  }
  function clearSelection() {
    state.multi = []; state.anchor = null; state.selected = null;
  }
  function fmtTs(ms) { return ms ? formatTime(ms) : '—'; }
  function isArchiveExt(ext) {
    return ['.zip', '.jar', '.rar', '.7z', '.tar', '.gz', '.tgz', '.bz2', '.xz'].indexOf(normExt(ext)) >= 0;
  }
  // —— 批量操作 ——
  function runBatch(label, items, fn) {
    if (!items.length) return;
    showToast(label + tr('中… 共 {n} 项', { n: items.length }));
    var done = 0, fail = 0, idx = 0;
    function next() {
      if (idx >= items.length) {
        showToast(fail ? (label + tr('完成：成功 {a} 项，失败 {b} 项', { a: done, b: fail })) : (label + tr('完成 {n} 项', { n: done })), fail ? 'error' : 'success');
        clearSelection();
        reload();
        return;
      }
      fn(items[idx++]).then(function () { done++; next(); }).catch(function () { fail++; next(); });
    }
    next();
  }
  function deleteSelected() {
    var items = selectedItems();
    if (items.length) deleteItems(items);
  }
  function deleteItems(items) {
    if (!items.length) return;
    var msg = items.length === 1
      ? tr('确定将 "{n}" 移入回收站吗？\n（可在回收站恢复）', { n: items[0].name })
      : tr('确定将选中的 {n} 项移入回收站吗？\n（可在回收站恢复）', { n: items.length });
    openConfirm(msg).then(function (ok) {
      if (!ok) return;
      runBatch(tr('移入回收站'), items, function (it) {
        return apiPost('/api/rm', { path: it.path, recursive: it.type === 'dir' });
      });
    });
  }
  function doDelete(item) { deleteItems([item]); }
  function copyBatch(items) {
    openModal(tr('批量复制到…（填写目标文件夹完整路径）'), state.current && state.current.path.indexOf('*') < 0 ? state.current.path : '')
      .then(function (to) {
        if (!to) return;
        runBatch(tr('复制'), items, function (it) {
          return apiPost('/api/cp', { from: it.path, to: to + '\\' + it.name });
        });
      });
  }
  function moveBatch(items) {
    openModal(tr('批量移动到…（填写目标文件夹完整路径）'), state.current && state.current.path.indexOf('*') < 0 ? state.current.path : '')
      .then(function (to) {
        if (!to) return;
        runBatch(tr('移动'), items, function (it) {
          return apiPost('/api/mv', { from: it.path, to: to + '\\' + it.name });
        });
      });
  }
  function downloadZip(items) {
    if (!items.length) return;
    showToast(tr('打包中… 共 {n} 项', { n: items.length }));
    fetch('/api/zip-create', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths: items.map(function (it) { return it.path; }) })
    })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then(function (b) {
        var a = document.createElement('a');
        var u = URL.createObjectURL(b);
        a.href = u; a.download = 'download-' + Date.now() + '.zip';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(u); }, 5000);
        showToast(tr('打包下载完成'));
      })
      .catch(function (e) { showToast(tr('打包下载失败: ') + e.message, 'error'); });
  }
  function batchRename(items) {
    openModal(tr('批量重命名（{name}=原名 {n}=序号，扩展名保留）'), '{n}_{name}').then(function (pat) {
      if (!pat) return;
      var jobs = [];
      items.forEach(function (it, i) {
        var dot = it.name.lastIndexOf('.');
        var base = dot > 0 ? it.name.slice(0, dot) : it.name;
        var ext = dot > 0 ? it.name.slice(dot) : '';
        var nn = pat.replace(/\{name\}/g, base).replace(/\{n\}/g, String(i + 1)) + ext;
        if (nn !== it.name) jobs.push({ path: it.path, newName: nn });
      });
      if (!jobs.length) { showToast(tr('没有需要重命名的项目')); return; }
      runBatch(tr('重命名'), jobs, function (j) {
        return apiPost('/api/rename', { path: j.path, newName: j.newName });
      });
    });
  }
  function extractAll(item) {
    showToast(tr('解压中…'));
    apiPost('/api/extract-all', { path: item.path })
      .then(function (r) {
        showToast(tr('解压完成：新文件 {w} 个', { w: r.written }) + (r.skipped ? tr('，跳过已存在 {s} 个', { s: r.skipped }) : ''));
        reload();
      })
      .catch(function (e) { showToast(tr('解压失败: ') + e.message, 'error'); });
  }

  // —— 属性面板 ——
  function showProps(item) {
    if (item._recycle) return;
    apiPost('/api/props', { path: item.path })
      .then(function (r) {
        var p = r.props;
        var rows = [
          [tr('名称'), p.name],
          [tr('类型'), p.type === 'dir' ? tr('文件夹') : tr('文件')],
          [tr('位置'), p.path],
          [tr('大小'), p.type === 'dir' ? (p.count >= 0 ? tr('{n} 个项目', { n: p.count }) : '—') : formatSize(p.size)],
          [tr('创建时间'), fmtTs(p.created)],
          [tr('修改时间'), fmtTs(p.modified)]
        ];
        if (p.md5) rows.push(['MD5', p.md5]);
        if (p.sha256) rows.push(['SHA256', p.sha256]);
        openProps(p.name, rows);
      })
      .catch(function (e) { showToast(tr('读取属性失败: ') + e.message, 'error'); });
  }
  function openProps(title, rows) {
    var ov = document.createElement('div');
    ov.className = 'props-overlay';
    ov.innerHTML = '<div class="props-box"><div class="props-title"></div><div class="props-rows"></div>' +
      '<div class="props-actions"><button class="btn">' + tr('关闭') + '</button></div></div>';
    ov.querySelector('.props-title').textContent = tr('属性 — {title}', { title: title });
    var wrap = ov.querySelector('.props-rows');
    rows.forEach(function (kv) {
      var r = document.createElement('div'); r.className = 'props-row';
      var k = document.createElement('span'); k.className = 'props-k'; k.textContent = kv[0];
      var v = document.createElement('span'); v.className = 'props-v'; v.textContent = kv[1];
      r.appendChild(k); r.appendChild(v); wrap.appendChild(r);
    });
    function close() { ov.remove(); }
    ov.addEventListener('mousedown', function (e) { if (e.target === ov) close(); });
    ov.querySelector('button').onclick = close;
    document.body.appendChild(ov);
  }

  // —— 回收站视图 ——
  function showRecycle() {
    return apiGet('/api/recycle').then(function (r) {
      state.current = { path: '*recycle*', source: 'local' };
      state.items = (r.items || []).map(function (it) {
        return {
          name: it.name, path: it.binPath, type: it.isDir ? 'dir' : 'file',
          size: it.size || 0, mtime: it.deletedAt || 0, ext: (it.name.match(/\.([^.]+)$/) || ['', ''])[1].toLowerCase(),
          _recycle: { id: it.id, originalPath: it.originalPath, deletedAt: it.deletedAt }
        };
      });
      clearSelection();
      state.previewItem = null; previewEl.classList.remove('open');
      render();
    });
  }
  function recycleRestore(item) {
    apiPost('/api/recycle-restore', { id: item._recycle.id })
      .then(function (r) { showToast(tr('已恢复到 {p}', { p: r.restored })); clearSelection(); reload(); })
      .catch(function (e) { showToast(tr('恢复失败: ') + e.message, 'error'); });
  }
  function recyclePurge(item) {
    openConfirm(tr('确定彻底删除 "{n}" 吗？\n（不可恢复）', { n: item.name })).then(function (ok) {
      if (!ok) return;
      apiPost('/api/recycle-purge', { id: item._recycle.id })
        .then(function () { showToast(tr('已彻底删除')); clearSelection(); reload(); })
        .catch(function (e) { showToast(tr('删除失败: ') + e.message, 'error'); });
    });
  }
  function recycleEmpty() {
    openConfirm(tr('确定清空回收站吗？\n（所有暂存项目将被彻底删除，不可恢复）')).then(function (ok) {
      if (!ok) return;
      apiPost('/api/recycle-empty', {})
        .then(function (r) { showToast(tr('已清空回收站（{n} 项）', { n: r.count })); clearSelection(); reload(); })
        .catch(function (e) { showToast(tr('清空失败: ') + e.message, 'error'); });
    });
  }

  function recycleRestoreAll() {
    openConfirm(tr('确定将回收站全部项目恢复到原位置吗？')).then(function (ok) {
      if (!ok) return;
      apiPost('/api/recycle-restore-all', {})
        .then(function (r) {
          showToast(r.failed ? tr('已恢复 {n} 项（{f} 项失败）', { n: r.count, f: r.failed }) : tr('已恢复 {n} 项', { n: r.count }));
          clearSelection(); reload();

        .catch(function (e) { showToast(tr('恢复失败: ') + e.message, 'error'); });

  }
  function recycleRestoreMany(sel) {
    openConfirm(tr('确定将选中的 {n} 项恢复到原位置吗？', { n: sel.length })).then(function (ok) {
      if (!ok) return;

      var next = function (i) {
        if (i >= ids.length) {
          showToast(fail ? tr('已恢复 {n} 项（{f} 项失败）', { n: done, f: fail }) : tr('已恢复 {n} 项', { n: done }));
          clearSelection(); reload(); return;

          .then(function () { done++; next(i + 1); })
          .catch(function () { fail++; next(i + 1); });
      };

    });
  }
  function recyclePurgeMany(sel) {
    openConfirm(tr('确定彻底删除选中的 {n} 项吗？\n（不可恢复）', { n: sel.length })).then(function (ok) {

        if (i >= ids.length) {
          showToast(fail ? tr('已彻底删除 {n} 项（{f} 项失败）', { n: done, f: fail }) : tr('已彻底删除 {n} 项', { n: done }));

  // —— 递归搜索 ——
  function runSearch(q, root) {

    state.searchQ = q; state.searchRoot = root;
    showToast(tr('搜索中…'));
    return apiGet('/api/search?path=' + enc(root.path) + '&q=' + enc(q)).then(function (r) {
      state.current = { path: '*search*', source: root.source || 'local' };
      state.items = r.results || [];
      clearSelection();
      state.previewItem = null; previewEl.classList.remove('open');

      showToast(r.truncated ? tr('搜索完成（超过 500 条，只显示前 500 条）') : tr('搜索完成，共 {n} 条', { n: (r.results || []).length }));
    }).catch(function (e) { showToast(tr('搜索失败: ') + e.message, 'error'); });
  }

  function makeItemEl(item) {
    var div = document.createElement('div');
    div.className = 'file-item';
    if (isSel(item)) div.classList.add('selected');
    div.setAttribute('data-path', item.path);
    div.title = item._recycle
      ? (item.name + tr('（原位置: {p}，删除于 {d}）', { p: item._recycle.originalPath, d: fmtTs(item._recycle.deletedAt) }))
      : item.name;   // hover 时以 tooltip 显示完整文件名
    if (state.viewMode === 'grid') {
      div.innerHTML = '<div class="icon">' + getIcon(item) + '</div><div class="name"></div>';
      div.querySelector('.name').textContent = item.name;
    } else {
      div.innerHTML = '<div class="icon">' + getIcon(item) + '</div>' +
        '<div class="name"></div>' +
        '<div class="size">' + (item.type === 'dir' ? '—' : formatSize(item.size)) + '</div>' +
        '<div class="time">' + (item.mtime ? formatTime(item.mtime) : '') + '</div>';
      div.querySelector('.name').textContent = item.name;
    }
    div.onclick = function (e) {
      if (item._recycle) { selectItem(item); if (item.type !== 'dir') previewFile(item); return; }
      // Ctrl/Shift 多选；普通点选 = 单选
      if (e && (e.ctrlKey || e.metaKey)) {
        toggleSel(item);
        state.selected = state.multi.length ? state.multi[state.multi.length - 1] : null;
        renderList(); renderStatus();
        return;
      }
      if (e && e.shiftKey) {
        selectRange(item);
        selectItem(item);
        return;
      }
      selectOnly(item);
      renderList(); renderStatus();
      // 压缩包文件单击进入（像文件夹一样）
      if (item.type === 'file' && !item._zip && ['zip','jar','rar','7z','tar','gz','tgz','bz2','xz'].indexOf(normExt(item.ext)) >= 0) {
        navTo({ path: item.path + '::', source: state.current.source });
        return;
      }
      // 单击文件触发预览（预览不再占用双击，双击留给系统程序打开）
      if (item.type !== 'dir') previewFile(item);
    };
    div.ondblclick = function () {
      if (item._recycle) return;
      openItem(item);
    };
    div.oncontextmenu = function (e) {
      e.preventDefault();
      if (!isSel(item)) selectOnly(item);
      selectItem(item);
      showContextMenu(e.clientX, e.clientY, item);

  }
  function renderStatus() {
    var total = state.items.length;
    var dirs = state.items.filter(function (i) { return i.type === 'dir'; }).length;
    $('status-count').textContent = tr('{n} 项 · {d} 个文件夹 · {f} 个文件', { n: total, d: dirs, f: (total - dirs) });
    $('status-selection').textContent = state.multi.length > 1
      ? tr('已选择 {n} 项', { n: state.multi.length })
      : (state.selected ? tr('已选择: {n}', { n: state.selected.name }) : '');
    $('status-path').textContent = state.current ? state.current.path : '';
    $('status-path').title = state.current ? state.current.path : '';
  }
  function render() {
    renderBreadcrumb();
    renderList();
    renderStatus();
    renderRoots();
    $('btn-back').disabled = state.historyIdx <= 0;
    $('btn-fwd').disabled  = state.historyIdx >= state.history.length - 1;
    $('btn-up').disabled = !state.current || state.current.path === '*' ||
      parentPath(state.current.path) === state.current.path;
  }
  function selectItem(item) {
    state.selected = item;
    renderList();
    renderStatus();
  }
  function navTo(target, pushHistory) {
    if (pushHistory === undefined) pushHistory = true;
    if (target.path === '*') return showDrives();
    if (target.path === '*fav*') return showFavorites();
    if (target.path === '*recycle*') return showRecycle();
    if (target.path === '*search*') return runSearch(state.searchQ, state.searchRoot);
    // —— ZIP 虚拟路径（path.zip::subdir）——

        add(tr('复制到…'), '🔁', function () { doCopy(item); });

  function doMkfile(t) {

      showToast(tr('请先打开一个文件夹'), 'error'); return;

  // —— "新建"二级菜单：文件夹 + 系统注册的文件类型（桌面右键菜单同源） ——

    clearTimeout(newMenuTimer);
    newMenuTimer = setTimeout(hideNewMenu, 150);
  }
  newMenuEl.addEventListener('mouseenter', function () { clearTimeout(newMenuTimer); });
  newMenuEl.addEventListener('mouseleave', scheduleHideNewMenu);
  function loadNewTypes() {
    fetch('/api/newfile-types', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        newTypes = d.types || [];
        if (newMenuEl.classList.contains('show')) {
          var x = parseInt(newMenuEl.style.left) || 0, y = parseInt(newMenuEl.style.top) || 0;
          hideNewMenu(); showNewMenu(x, y);

  function doRename(item) {
    openModal(tr('重命名'), item.name).then(function (name) {
      if (!name || name === item.name) return;
      apiPost('/api/rename', { path: item.path, newName: name })
        .then(reload)
        .catch(function (e) { showToast(tr('重命名失败: ') + e.message, 'error'); });
    });

  // 复制到…：弹出目标路径输入框，确认后调用 /api/cp（后端递归复制）
  function doCopy(item) {
    openModal(tr('复制到…（填写完整目标路径）'), item.path).then(function (to) {
      if (!to || to === item.path) return;
      showToast(tr('复制中…'));

  function doMove(item) {

      if (!to || to === item.path) return;

      apiPost('/api/mv', { from: item.path, to: to })
        .then(function () {
          if (state.selected && state.selected.path === item.path) state.selected = null; state.multi = []; state.anchor = null;
          if (state.previewItem && state.previewItem.path === item.path) {
            state.previewItem = null;

          showToast(tr('移动完成'));
          reload();

        .catch(function (e) { showToast(tr('移动失败: ') + e.message, 'error'); });
    });

  function doGoto() {
    openModal(tr('跳转到路径（绝对路径）'), state.current && state.current.path !== '*' ? state.current.path : '')
      .then(function (p) {
        if (!p) return;
        navTo({ path: p, source: state.current ? state.current.source : 'default' });
      });
  }
  function uploadFiles(files) {
    if (!state.current || state.current.path === '*' || state.current.path === '*fav*' || state.current.path === '*recycle*' || state.current.path === '*search*') {
      showToast(tr('请先打开一个文件夹'), 'error'); return;
    }
    var dir = state.current.path;
    var arr = Array.prototype.slice.call(files);
    if (!arr.length) return;
    showToast(tr('上传中… 共 {n} 个文件', { n: arr.length }));
    var idx = 0, ok = 0, fail = 0;
    function next() {
      if (idx >= arr.length) {
        showToast(tr('上传完成: {ok} 成功', { ok: ok }) + (fail ? tr(' / {f} 失败', { f: fail }) : ''),
          fail ? 'error' : 'ok');
        reload();
        return;
      }
      var f = arr[idx++];
      var url = '/api/upload?path=' + enc(dir) + '&name=' + enc(f.name) + '&overwrite=1';
      fetch(url, { method: 'POST', body: f, credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (d) { d.ok ? ok++ : fail++; next(); })
        .catch(function () { fail++; next(); });
    }
    next();
  }

  function saveSortPref() {

        state.sortKey = s.key; state.sortAsc = s.asc;

  // —— 侧栏收起/展开（工具栏按钮 / Ctrl+B，偏好持久化）——
  function applySidebar(collapsed) {

  // —— 预览面板拖拽调宽 ——

      startX = e.clientX;
      startW = previewEl.offsetWidth;

      previewEl.classList.add('no-transition');

  // —— 鼠标框选多选（橡皮筋选择） ——
  var bandEl = null, bandStart = null;
  listEl.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    if (e.target.closest && e.target.closest('.file-item')) return;
    bandStart = { x: e.clientX, y: e.clientY, moved: false };
    e.preventDefault();
    document.addEventListener('mousemove', bandMove);
    document.addEventListener('mouseup', bandUp);
  });
  function bandMove(e) {
    if (!bandStart) return;
    var x1 = Math.min(bandStart.x, e.clientX), y1 = Math.min(bandStart.y, e.clientY);
    var x2 = Math.max(bandStart.x, e.clientX), y2 = Math.max(bandStart.y, e.clientY);
    if (Math.abs(x2 - x1) + Math.abs(y2 - y1) > 6) bandStart.moved = true;
    if (!bandEl) {
      bandEl = document.createElement('div');
      bandEl.className = 'rubber-band';
      document.body.appendChild(bandEl);
      document.body.classList.add('band-active');
    }
    bandEl.style.left = x1 + 'px'; bandEl.style.top = y1 + 'px';
    bandEl.style.width = (x2 - x1) + 'px'; bandEl.style.height = (y2 - y1) + 'px';
  }
  function bandUp(e) {
    document.removeEventListener('mousemove', bandMove);
    document.removeEventListener('mouseup', bandUp);
    if (bandEl) { bandEl.remove(); bandEl = null; }
    document.body.classList.remove('band-active');
    if (!bandStart) return;
    var st = bandStart; bandStart = null;
    if (!st.moved) {
      // 单击空白：清除选择
      if (state.multi.length || state.selected) { clearSelection(); renderList(); renderStatus(); }
      return;
    }
    var l = Math.min(st.x, e.clientX), t = Math.min(st.y, e.clientY);
    var r = Math.max(st.x, e.clientX), b = Math.max(st.y, e.clientY);
    var picked = [];
    var els = listEl.querySelectorAll('.file-item');
    for (var i = 0; i < els.length; i++) {
      var rc = els[i].getBoundingClientRect();
      if (rc.right >= l && rc.left <= r && rc.bottom >= t && rc.top <= b) {
        var p = els[i].getAttribute('data-path');
        for (var k = 0; k < state.items.length; k++) {
          if (state.items[k].path === p) { picked.push(state.items[k]); break; }
        }
      }
    }
    state.multi = picked;
    state.selected = picked.length ? picked[picked.length - 1] : null;
    state.anchor = state.selected;
    renderList(); renderStatus();
  }
  fileInput.onchange = function () {
    uploadFiles(fileInput.files);
    fileInput.value = '';
  };
  listEl.oncontextmenu = function (e) {
    if (e.target === listEl) {
      e.preventDefault();
      state.selected = null; state.multi = []; state.anchor = null;
      renderList(); renderStatus();
      showContextMenu(e.clientX, e.clientY, null);
    }
  };
  document.addEventListener('dragover', function (e) {
    if (e.dataTransfer && e.dataTransfer.types.indexOf('Files') >= 0) {
      e.preventDefault();
      appEl.classList.add('dragover');
    }
  });
  document.addEventListener('dragleave', function (e) {
    if (e.relatedTarget === null) appEl.classList.remove('dragover');
  });
  document.addEventListener('drop', function (e) {
    e.preventDefault();
    appEl.classList.remove('dragover');
    if (e.dataTransfer.files && e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });
  document.addEventListener('click', function (e) {
    if (!contextMenuEl.contains(e.target)) hideContextMenu();
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' ||
        e.target.tagName === 'SELECT' || e.target.isContentEditable) return;
    if (modalBg.classList.contains('show')) return;   // 弹窗打开时不触发列表快捷键
    if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
      e.preventDefault();
      state.multi = state.items.slice();
      state.anchor = null;
      renderList(); renderStatus();
      return;
    }
    if (e.key === 'Escape') {
      if (state.multi.length || state.selected) { clearSelection(); renderList(); renderStatus(); }
      return;
    }
    if (e.key === 'F5') { e.preventDefault(); reload(); return; }
    if (e.key === 'Backspace') { e.preventDefault(); navUp(); return; }
    if (e.key === 'Enter' && state.selected) { openItem(state.selected); return; }
    if (e.key === 'Delete') { deleteSelected(); return; }
    if (e.key === 'F2' && state.selected) { doRename(state.selected); return; }
    if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'u') { e.preventDefault(); fileInput.click(); return; }
    if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'l') { e.preventDefault(); doGoto(); return; }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); doMkdir(); return; }
    if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); navBack(); return; }
    if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); navFwd(); return; }
  });

  function init() {
    loadFavorites();
    apiGet('/api/roots').then(function (r) {
      state.roots = r.roots || [];
      renderRoots();
      var first = state.roots[0];
      if (first) {
        if (first.path === '*') showDrives();
        else navTo({ path: first.path, source: first.source });
      }
    }).catch(function (e) {
      var errDiv = document.createElement('div');  // P1 #3 修复：错误消息可能含恶意文件名，改用 textContent 绕开 innerHTML
      errDiv.style.cssText = 'padding:20px;color:var(--danger)';
      errDiv.textContent = tr('加载失败: ') + e.message;
      var treeEl = document.getElementById('tree');
      treeEl.innerHTML = '';
      treeEl.appendChild(errDiv);
    });
  }
  // —— 语言切换器接线 ——
  (function () {
    var sel = $('lang-switch');
    if (!sel) return;
    sel.value = LANG;
    sel.onchange = function () { setLang(sel.value); };
  })();
  applyI18n();
  init();
})();
</script>
</body>
</html>
